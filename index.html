<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="color-scheme" content="dark">
  <title>CloudStatus</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>☁️ 全球雲端與網路服務狀態</h1>
        <p id="updated">即時讀取官方來源…</p>
      </div>
      <button id="reload" class="icon-btn" type="button">↻</button>
    </header>

    <section class="toolbar">
      <div id="filters" class="filters">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="cloud">雲端</button>
        <button class="chip" data-filter="ai">AI</button>
        <button class="chip" data-filter="developer">開發者</button>
        <button class="chip" data-filter="platform">平台</button>
        <button class="chip" data-filter="hosting">Hosting</button>
        <button class="chip" data-filter="datacenter">數據中心</button>
        <button class="chip" data-filter="backbone">骨幹網</button>
      </div>
      <div class="tools">
        <input id="search" type="search" placeholder="搜尋服務或事件…" autocomplete="off">
        <label class="toggle">
          <input id="activeOnly" type="checkbox">
          <span>只看異常</span>
        </label>
      </div>
    </section>

    <section class="summary" id="summary"></section>
    <section class="grid" id="services"></section>

    <footer>可跨域讀取的官方 API 直接顯示；其餘服務直接連到官方狀態頁。</footer>
  </main>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
