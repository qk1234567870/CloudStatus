<!doctype html>
<html lang="zh-Hant">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="color-scheme" content="dark">
  <title>CloudStatus</title>
  <link rel="stylesheet" href="./assets/style.css?v=72.0.0">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="heading">
        <h1 id="pageTitle"></h1>
        <p id="updated"></p>
      </div>
      <button id="reload" class="icon-btn" type="button" aria-label="重新整理">↻</button>
    </header>

    <section class="toolbar" id="toolbar">
      <div id="filters" class="filters"></div>
      <div class="tools" id="tools">
        <input id="search" type="search" autocomplete="off">
        <label class="toggle" id="activeOnlyWrap">
          <input id="activeOnly" type="checkbox">
          <span id="activeOnlyLabel"></span>
        </label>
      </div>
    </section>

    <section class="summary" id="summary"></section>
    <section id="services"></section>
    <footer id="footer"></footer>
  </main>

  <script src="./assets/config.js?v=72.0.0"></script>
  <script src="./assets/services.js?v=72.0.0"></script>
  <script src="./assets/app.js?v=72.0.0"></script>
</body>
</html>
