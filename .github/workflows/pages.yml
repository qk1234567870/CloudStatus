name: Build and Deploy CloudStatus

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "web/**"
      - "config.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data
        run: python scripts/build.py

      - name: Prepare Pages
        run: |
          rm -rf public
          mkdir -p public
          cp -R web/. public/
          mkdir -p public/data
          cp data/status.json public/data/status.json
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
